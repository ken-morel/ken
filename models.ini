[*]
n-gpu-layers = 99
# flash-attn is required for quantized V cache (q8_0) and O(N) memory at 16k context
flash-attn = on
load-mode = none
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
# apparantly bigger helpts imrpve prompt processing on igpu
ubatch-size = 512
parallel = 1

[qwen]
model = /home/engon/models/qwen3.5-4b-q4_k_m.gguf
mmproj = /home/engon/models/mmproj-bf16.gguf
ctx-size = 16384
# swa-full = true
temp = 0.6
top-p = 0.95
top-k = 20
presence-penalty = 1.5
slot-save-path = /home/engon/.cache/ken/slots


[lfm]
model = /home/engon/models/lfm2.5-1.2b-instruct-q4_k_m.gguf
ctx-size = 32768

temp = 0.1
min-p = 0.15
repeat-penalty = 1.05
top-k = 50
slot-save-path = /home/engon/.cache/ken/slots

[dsk]
model = /home/engon/models/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
ctx-size = 8192
temp = 0.6
top-p = 0.95
top-k = 20
presence-penalty = 1.5
slot-save-path = /home/engon/.cache/ken/slots
