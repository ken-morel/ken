[*]
n-gpu-layers = 99
# flash-attn is required for quantized V cache (q8_0) and O(N) memory at 16k context
flash-attn = on
load-mode = none
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
# Larger batch/ubatch improves prompt processing throughput on Radeon Vega iGPU (~163 t/s)
# Note: Lower ctx-size to 8192 if you need to save ~300-400MB RAM per model
batch-size = 2048
ubatch-size = 512
parallel = 1

[q]
model = /home/engon/models/qwen3.5-4b-q4_k_m.gguf
ctx-size = 16384
# swa-full = true
temp = 0.6
top-p = 0.95
top-k = 20
presence-penalty = 1.5
slot-save-path = /home/engon/.cache/ken/slots

